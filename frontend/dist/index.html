<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mappa dell'Avventura</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one full-screen stage for the classroom board (LIM). The map is fitted 4:3 inside #view; HUD in the corners;
   the teacher's "Regia" sits beside the map on wide screens, or fills a phone used as remote. Single dark world. */
:root{
  --ink:#121c1d; --panel:#182627; --panel-2:#213233; --line:#34494a;
  --parchment:#efe4c8; --parch-ink:#2b2418; --parch-mute:#7b6a46; --muted:#a9a088;
  --gold:#e3b75a; --gold-deep:#a8802f; --leaf:#8fc27a; --ember:#e0683f; --violet:#a98be0;
  --f-display:"IM Fell English SC","Palatino Linotype","Book Antiqua",Georgia,serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--parchment);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#stage{position:fixed;inset:0;overflow:hidden}
#view{position:absolute;inset:0}
@media (min-width:900px){ body.side #view{right:420px} }
#board{position:absolute;box-shadow:0 0 0 1px #000,0 20px 80px rgba(0,0,0,.6)}
#board img,#board canvas,#board svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#board img{user-select:none;-webkit-user-drag:none}
#fog{pointer-events:none;transition:opacity .6s ease}
body.editing #fog{opacity:.15}
#svg{touch-action:none}

.reg{fill:transparent;stroke:none;pointer-events:all;cursor:pointer}
.reg.open:hover{stroke:var(--gold);stroke-width:6;stroke-dasharray:18 10;fill:rgba(227,183,90,.08)}
.reg.reach:hover{stroke:var(--parchment);stroke-opacity:.5;stroke-width:5;stroke-dasharray:6 12}
.reg.glow{stroke:var(--gold);stroke-width:10;animation:glow 3.2s ease-out forwards}
@keyframes glow{0%{stroke-opacity:0}25%{stroke-opacity:1;fill:rgba(227,183,90,.18)}100%{stroke-opacity:0;fill:transparent}}
body.editing .reg{stroke:var(--parchment);stroke-opacity:.6;stroke-width:4;fill:rgba(239,228,200,.06)}
body.editing .reg.sel{stroke:var(--gold);stroke-opacity:1;stroke-width:7;fill:rgba(227,183,90,.16)}
.lbl{font-family:var(--f-display);font-size:44px;fill:var(--parchment);stroke:#1b1510;stroke-width:9px;paint-order:stroke;stroke-linejoin:round;text-anchor:middle;pointer-events:none;letter-spacing:.5px}
.lbl.dim{fill:#cfc6ae;font-size:38px}
body.editing .lbl{pointer-events:all;cursor:move}
.handle{fill:var(--gold);stroke:#1b1510;stroke-width:5;cursor:grab}
.handle:hover{fill:#fff}
.draft{fill:rgba(227,183,90,.15);stroke:var(--gold);stroke-width:6;stroke-dasharray:14 10;pointer-events:none}
.draft-pt{fill:var(--gold);stroke:#1b1510;stroke-width:4;pointer-events:none}
.draft-pt.first{fill:#fff}
body.placing #svg,body.drawing #svg{cursor:crosshair}
.trail{display:none;fill:none;stroke:var(--gold);stroke-width:7;stroke-dasharray:2 16;stroke-linecap:round;opacity:.85;pointer-events:none}
.token{pointer-events:none}
.token .bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.pin{cursor:pointer}
.pin .halo{fill:rgba(227,183,90,.22);animation:halo 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{50%{transform:scale(1.35);opacity:.4}}
.pin .core{fill:#1b1510;stroke:var(--gold);stroke-width:5}
.pin text{font-family:var(--f-display);font-size:40px;fill:var(--gold);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin.done .core{fill:var(--gold);stroke:#1b1510}
.pin.done text{fill:#1b1510}
.pin.sel .core{stroke:#fff;stroke-width:8}

/* HUD: two bands above and below the map, so nothing sits on top of it */
.bar{position:absolute;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#topbar{top:0;padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px}
#botbar{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));padding-top:8px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
#classBadge{font-family:var(--f-display);font-size:22px;letter-spacing:1px;padding:4px 16px;white-space:nowrap}
#classBadge small{font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-right:8px}
.res{display:flex;align-items:center;gap:10px;padding:5px 12px}
.res .lant{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;color:var(--gold)}
.res .lant svg{width:24px;height:24px;stroke:var(--gold);fill:none;stroke-width:1.6}
.res .lant.bump{animation:bump .7s ease}
@keyframes bump{40%{transform:scale(1.35)}}
.res .sep{width:1px;height:22px;background:var(--line)}
#bagBtn{position:relative;display:grid;place-items:center;width:36px;height:34px;padding:0;border:0;background:transparent;border-radius:8px}
#bagBtn:hover{background:var(--panel-2)}
#bagBtn svg{width:26px;height:26px;stroke:var(--parchment);fill:none;stroke-width:1.6}
#bagN{position:absolute;right:-4px;top:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:#1b1510;font-size:12px;font-weight:700;line-height:19px;text-align:center;font-variant-numeric:tabular-nums}
#bagN.zero{background:var(--panel-2);color:var(--muted);border:1px solid var(--line);line-height:17px}
#bagBtn.bump{animation:bagbump .9s ease}
@keyframes bagbump{20%{transform:translateY(-6px) rotate(-8deg)}45%{transform:translateY(0) rotate(6deg)}70%{transform:rotate(-3deg)}}
.baggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.bagit{background:#e6d8b4;border:1px solid #cdbb8f;border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;text-align:left;color:var(--parch-ink)}
.bagit:hover{border-color:#8a3a22}
.bagit .sw2{flex:none}
.bagit b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.05em;line-height:1.1}
.bagit small{display:block;font-size:.72em;color:#5d4f33;line-height:1.35;margin-top:3px}
.lore{border-top:1px solid #b9a477;border-bottom:1px solid #b9a477;padding:.6em 0;margin:.4em 0 .8em}
.lore p{white-space:pre-wrap;margin:0;max-width:62ch}
.loreimg{display:block;width:100%;max-height:42vh;object-fit:cover;border-radius:8px;border:1px solid #b9a477;margin:.2em 0 .8em}
.chron .pg .loreimg{max-height:200px;margin:.3em 0 .5em}
.lore p::first-letter{font-family:var(--f-display);float:left;font-size:3.1em;line-height:.85;margin:.06em .12em 0 0;color:#8a3a22}
.chron{display:flex;flex-direction:column;gap:14px}
.chron .pg small{display:block;color:#8a3a22;text-transform:uppercase;letter-spacing:.1em;font-size:.65em;font-weight:700;margin-bottom:2px}
.chron .pg p{white-space:pre-wrap;margin:0}
.shipmark{display:grid;place-items:center}
.shipmark svg{width:24px;height:24px;stroke:var(--parchment);fill:none;stroke-width:1.6}
#carillon{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;cursor:pointer}
#carillon:hover{border-color:var(--gold)}
#carillon .cbox{width:34px;height:34px;border-radius:50%;background:var(--gold);display:grid;place-items:center;flex:none}
#carillon .cbox svg{width:20px;height:20px;stroke:#1b1510;fill:none;stroke-width:1.6}
#carillon.playing .cbox{animation:bump 1.2s ease-in-out infinite}
.cells{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cell{min-width:26px;height:26px;border-radius:5px;border:1px dashed #5d6f6d;transition:background .3s;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#1b1510}
.cell.on{background:var(--violet);border:1px solid #1b1510;box-shadow:0 0 8px rgba(169,139,224,.6)}
.cell.now{background:#fff}
#energy{display:flex;align-items:center;gap:10px;padding:8px 14px}
.e-lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.e-bar{display:grid;grid-template-columns:repeat(10,12px);gap:3px}
.e-seg{height:16px;border-radius:3px;background:#2b3b3c;transition:background .4s}
.e-seg.on{background:var(--leaf)}
#energy .e-seg.on{background:var(--gold)}
#energy.mid .e-seg.on{background:#e08a3f}
#energy.low .e-seg.on{background:#d9483b}
.dragon-eye{width:min(220px,40vw);height:auto;display:block;margin:0 auto .4em}
.dragon-eye .lid{animation:lid 1.6s ease-out forwards;transform-origin:center}
@keyframes lid{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
#energy.low{animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{box-shadow:0 0 0 3px rgba(224,104,63,.45)}}
.e-msg{font-family:var(--f-display);font-size:16px;white-space:nowrap;display:inline-block;width:12em;overflow:hidden;text-overflow:ellipsis;transform-origin:left center}
.e-msg.pop{animation:msgpop 1.1s cubic-bezier(.2,.9,.3,1.2)}
@keyframes msgpop{0%{transform:scale(.6);opacity:0}35%{transform:scale(1.4);opacity:1;color:#fff;text-shadow:0 0 14px rgba(255,140,60,.9)}65%{transform:scale(.92)}100%{transform:scale(1)}}
.e-brk{display:none}
.ebtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--parchment);font-weight:700;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;flex:none}
.ebtn:hover{border-color:var(--gold)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);padding:0;flex:none}
.iconbtn:hover{border-color:var(--gold)}
.iconbtn svg{width:21px;height:21px;stroke:var(--parchment);fill:none;stroke-width:1.8}
.tsep{width:1px;height:26px;background:var(--line);margin:0 2px}
#btnRegia{border-radius:999px;width:auto;padding:0 18px;font-weight:700;letter-spacing:.04em}
#btnRegia[aria-pressed="true"]{background:var(--gold);color:#1b1510;border-color:var(--gold)}
#mapwrap{position:absolute;left:0;right:0;top:60px;bottom:64px;overflow:hidden;touch-action:none}
#mapwrap.panning{cursor:grabbing}
#mapwrap,#mapwrap *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#board{transform-origin:0 0}
.rocketpin{cursor:pointer}
.rocketpin .halo{fill:rgba(169,139,224,.3);animation:halo 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.rocketpin.sel .core{stroke:#fff;stroke-width:8}
#planetView{position:absolute;left:0;right:0;z-index:4;background:#07051a;overflow:hidden}
#planetCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv-ui{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"title tog" "slot mel" "text back";gap:14px 24px;padding:18px 22px;pointer-events:none}
.pv-ui > *{pointer-events:auto}
.pv-slot{grid-area:slot;pointer-events:none;min-height:0}
.pv-title{grid-area:title;align-self:start;min-width:0;font-family:var(--f-display);font-size:clamp(26px,3.4vw,52px);line-height:1.05;color:#e9dcff;text-shadow:0 2px 18px rgba(120,60,220,.8);pointer-events:none}
.pv-title small{display:block;font-family:var(--f-body);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#b8a4e8}
.pv-text{grid-area:text;justify-self:start;align-self:end;max-width:min(560px,100%);background:rgba(20,10,45,.8);border:1px solid #4c3486;border-radius:14px;padding:12px 16px;line-height:1.45;font-size:clamp(15px,1.25vw,19px);white-space:pre-wrap}
.pv-mel{grid-area:mel;align-self:center;justify-self:end;width:auto;max-width:min(46vw,720px);min-width:min(300px,100%);max-height:100%;overflow:auto;background:rgba(20,10,45,.84);border:1px solid #4c3486;border-radius:18px;padding:16px 20px;display:flex;flex-direction:column;gap:6px;animation:melin .9s ease 1.6s both}
@keyframes melin{from{opacity:0}}
.pv-mel .mh{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#b8a4e8;font-weight:700}
.ml{display:flex;align-items:center;gap:clamp(10px,1.6vw,26px);flex-wrap:wrap}
.mn{font-size:12px;color:#8f7cc7;min-width:1.2em;font-variant-numeric:tabular-nums}
.mg{display:flex;gap:5px}
.nt{display:inline-grid;place-items:center;min-width:2.3em;padding:.22em .45em;border-radius:10px;background:#3b2475;color:#efe4ff;font-family:var(--f-display);font-size:clamp(15px,min(1.8vw,2.6vh),30px);line-height:1}
.nt.magic{background:var(--gold);color:#1b1510;box-shadow:0 0 14px rgba(227,183,90,.7)}
.ml.cont{margin-top:-2px}
.ml + .ml:not(.cont){margin-top:6px}
.mleg{display:flex;align-items:center;gap:10px;font-size:13px;color:#cbbcf0;padding-top:4px;border-top:1px solid #3f2c78}
.mleg .nt{font-size:15px;min-width:1.8em}
.pv-meltog{grid-area:tog;justify-self:end;align-self:start;padding:8px 14px;border-radius:999px;border:1px solid #8c6ad8;background:#2a1858;color:#efe4ff;font-weight:700;font-size:13px;white-space:nowrap}
@media (max-width:820px){ .pv-ui{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(90px,1fr) fit-content(55%) auto auto;grid-template-areas:"title tog" "slot slot" "mel mel" "text text" "back back";gap:10px;padding:12px 14px} .pv-mel{width:auto;justify-self:stretch;align-self:stretch;min-height:0;max-height:100%;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y} .pv-text{max-width:none;justify-self:stretch} .pv-title{font-size:24px} }
.pv-back{grid-area:back;justify-self:end;align-self:end;display:inline-flex;gap:10px;align-items:center;padding:12px 20px;border-radius:999px;border:1px solid #8c6ad8;background:#2a1858;color:#efe4ff;font-weight:700;white-space:nowrap}
.pv-back svg{width:20px;height:20px}
#ctx{position:absolute;z-index:25;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.5);display:flex;flex-direction:column}
#ctx .t{font-family:var(--f-display);font-size:18px;padding:6px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
#ctx button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-weight:700;font-size:14px}
#ctx button:hover{background:var(--panel-2)}
#ctx button.warn{color:#f0b49f}

/* player */
#player{display:flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;width:min(440px,100%);flex:0 1 440px}
#plRestart{width:34px;height:34px;background:transparent!important;border-color:var(--line)!important}
#plRestart svg{fill:none!important;stroke:var(--parchment)!important;stroke-width:2;width:18px;height:18px}
#player .iconbtn{background:var(--gold);border-color:var(--gold)}
#player .iconbtn svg{stroke:none;fill:#1b1510}
.pl-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pl-name{font-family:var(--f-display);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:1px}
.pl-row{display:flex;align-items:center;gap:8px}
.pl-time{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
#plSeek{flex:1;width:auto;min-width:0;height:16px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer}
#plSeek::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--gold),var(--gold)) 0/var(--pct,0%) 100% no-repeat,#33494a}
#plSeek::-moz-range-track{height:4px;border-radius:2px;background:#33494a}
#plSeek::-moz-range-progress{height:4px;border-radius:2px;background:var(--gold)}
#plSeek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);margin-top:-5px;border:2px solid #1b1510}
#plSeek::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #1b1510}
.pl-vol{flex:none;display:flex;align-items:center;gap:6px}
.pl-vol svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8}
input[type=range]{accent-color:var(--gold);width:90px}

#empty{position:absolute;z-index:6;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:center}
#empty h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 8px}
#empty p{color:var(--muted);margin:0 0 16px;line-height:1.5}

/* overlay card (parchment) */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(8,12,13,.55);display:grid;place-items:center;padding:16px}
#card{position:relative;width:min(780px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--parchment);color:var(--parch-ink);border-radius:6px;padding:clamp(20px,3.2vw,40px);box-shadow:0 30px 90px rgba(0,0,0,.6),inset 0 0 0 6px #e4d6b2,inset 0 0 0 7px #b9a477;font-size:clamp(16px,1.45vw,22px);line-height:1.5;animation:cardin .45s cubic-bezier(.2,.9,.3,1.2)}
#card.wide{width:min(1000px,100%)}
#card.bg{width:min(900px,100%);background:linear-gradient(rgba(239,228,200,.68),rgba(239,228,200,.8)),var(--bg) center/cover no-repeat,var(--parchment)}
#card.bg .bgpanel{display:contents}
#card.bg p,#card.bg h2,#card.bg h3,#card.bg .kicker,#card.bg .big{text-shadow:0 0 12px rgba(239,228,200,.9)}
.bgmini{width:96px;height:64px;border-radius:8px;background:#2a3d3e center/cover;border:1px solid var(--line)}
@keyframes cardin{from{transform:translateY(30px) scale(.96);opacity:0}}
#card .kicker{font-size:.62em;text-transform:uppercase;letter-spacing:.14em;color:var(--parch-mute);font-weight:700}
#card h2{font-family:var(--f-display);font-weight:400;font-size:2.05em;line-height:1.05;margin:.1em 0 .45em;text-wrap:balance}
#card h3{font-size:.62em;text-transform:uppercase;letter-spacing:.14em;color:var(--parch-mute);margin:1.1em 0 .35em}
#card p{margin:0;white-space:pre-wrap;max-width:64ch}
#card .ph{color:#9c8b66;font-style:italic}
#card .crow{display:flex;flex-wrap:wrap;gap:12px;margin-top:1.3em;align-items:center}
#card .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:1px solid #b9a477;background:transparent;color:var(--parch-ink);font-size:24px;line-height:1}
.pbtn{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;border:2px solid var(--parch-ink);background:transparent;color:var(--parch-ink);font-weight:700;font-size:.82em}
.pbtn.solid{background:var(--parch-ink);color:var(--parchment)}
.pbtn.gold{border-color:var(--gold-deep);background:var(--gold);color:#2b2418}
.pbtn.red{border-color:#8a3a22;color:#8a3a22}
.pbtn:disabled{opacity:.4;cursor:default}
.pbtn svg{width:1.2em;height:1.2em}
.who{display:flex;gap:18px;align-items:center;background:#e6d8b4;border-radius:10px;padding:12px;margin:.6em 0}
.who .face{width:110px;height:110px;border-radius:50%;flex:none;background:#cdbb8f center/cover;border:3px solid #b9a477;display:grid;place-items:center;font-family:var(--f-display);font-size:42px;color:#7b6a46}
.who .nm{font-family:var(--f-display);font-size:1.35em;line-height:1.1}
.who .line{font-style:italic}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps li{display:flex;gap:10px;align-items:flex-start}
.steps button{flex:none;width:28px;height:28px;border-radius:6px;border:2px solid var(--parch-ink);background:transparent;display:grid;place-items:center;padding:0;margin-top:2px;color:var(--parchment)}
.steps button.on{background:var(--parch-ink)}
.steps button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}
.steps .tick{flex:none;width:28px;height:28px;border-radius:6px;border:2px solid var(--parch-ink);display:grid;place-items:center;margin-top:2px}
.steps .tick.on{background:var(--parch-ink);color:var(--parchment)}
.steps button.tick{padding:0;cursor:pointer}
.steps .tick svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3}
.steps li.now .tick{border-color:var(--gold-deep);background:var(--gold)}
.steps li.sealed{color:#9c8b66}
.steps li.sealed .tick{border-style:dashed;border-color:#b9a477}
.steps li.sealed .tick svg{stroke:#8a3a22;stroke-width:1.8}
.trialed{display:flex;flex-direction:column;gap:6px}
.trialed .btn{align-self:flex-end}
.seal{display:flex;gap:12px;align-items:center;border:2px dashed #b9a477;border-radius:10px;padding:12px;color:#7b6a46}
.seal svg{width:30px;height:30px;flex:none;stroke:#8a3a22;fill:none;stroke-width:1.6}
.secret{background:#2b2418;color:var(--parchment);border-radius:10px;padding:14px 16px}
#card .secret p{color:var(--parchment)}
.big{font-family:var(--f-display);font-size:2.6em;line-height:1;text-align:center;margin:.2em 0 .3em}
.center{text-align:center}
.center p{margin-inline:auto}
.cost{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:1.3em;color:#8a5a00}
.cost svg{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.gcard{background:#e6d8b4;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.gcard .face{width:96px;height:96px;border-radius:50%;background:#cdbb8f center/cover;border:3px solid #b9a477;display:grid;place-items:center;font-family:var(--f-display);font-size:36px;color:#7b6a46}
.gcard.unknown{opacity:.55}
.gcard .nm{font-family:var(--f-display);font-size:1.15em;line-height:1.1}
.gcard small{color:#7b6a46;font-size:.7em;text-transform:uppercase;letter-spacing:.08em}
.loglist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loglist li{display:flex;gap:12px}
.loglist time{flex:none;color:#7b6a46;font-size:.75em;min-width:3.5em;padding-top:.2em;font-variant-numeric:tabular-nums}
.shop{display:flex;flex-direction:column;gap:8px}
.shop .it{display:flex;gap:12px;align-items:center;background:#e6d8b4;border-radius:10px;padding:10px 12px}
.shop .it .sw2{width:30px;height:30px;border-radius:8px;flex:none;border:1px solid #1b1510;display:grid;place-items:center;font-family:var(--f-display)}
.shop .it .tx{flex:1;min-width:0}
.shop .it .tx small{display:block;color:#7b6a46}

/* drawer */
#drawer{position:absolute;z-index:30;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .3s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#drawer.open{transform:none}
.d-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.d-head h1{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:10px 10px;color:var(--muted);border-bottom:2px solid transparent;font-weight:700;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--parchment);border-color:var(--gold)}
.d-body{flex:1;overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:18px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.note{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
.banner{background:#3a2a18;border:1px solid #6b4a22;color:#f3d9a8;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45}
.alert{background:#2b2350;border:1px solid #6a55b8;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.alert b{font-family:var(--f-display);font-weight:400;font-size:19px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:13px}
.seg.cls button{font-family:var(--f-display);font-size:18px;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1b1510;border-color:var(--gold)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--panel-2);border:1px solid transparent;border-radius:10px;padding:6px 6px 6px 10px}
.row.sel{border-color:var(--gold)}
.row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.row .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-right:4px;font-weight:700}
.pill.fog{background:#33494a;color:#c9d2d0}
.pill.exp{background:#4b3d7a;color:#e4dbff}
.pill.lib{background:var(--gold);color:#1b1510}
.pill.here{background:var(--leaf);color:#13230e}
.btn{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:#2a3d3e;font-weight:700;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#1b1510;border-color:var(--gold)}
.btn.ghost{background:transparent}
.btn.danger{border-color:#7a3a2a;color:#f0b49f}
.btn.armed{background:var(--ember);color:#1b1510;border-color:var(--ember)}
.btn:disabled{opacity:.45;cursor:default}
.cnt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cnt .val{font-size:28px;font-family:var(--f-display);min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.cnt .btn.sq{font-size:20px;width:42px;height:38px;padding:0}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.inp{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:400;letter-spacing:0;color:var(--parchment);width:100%}
textarea.inp{min-height:76px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:#fff}
.flexrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.check{display:flex;gap:10px;align-items:center;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.status{font-size:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.audioname{font-size:13px;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box > .sec-t{color:var(--gold)}
.facemini{width:56px;height:56px;border-radius:50%;background:#2a3d3e center/cover;border:1px solid var(--line)}
body.remote #view{display:none!important}
body.remote #drawer{transform:none;width:100%;border-left:0;transition:none}
body.remote #btnCloseDrawer{display:none}
.remotebar{display:flex;flex-wrap:wrap;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.remotebar .lab{width:100%;font-size:12px;color:var(--muted)}
.cnt .lab{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;min-width:5.5em}
#toast{position:absolute;z-index:40;left:50%;bottom:calc(var(--botH,64px) + 12px);transform:translateX(-50%);background:var(--parchment);color:var(--parch-ink);padding:10px 18px;border-radius:999px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px);text-align:center}
#toast button{margin-left:10px;border:0;border-radius:999px;background:var(--parch-ink);color:var(--parchment);padding:4px 12px;font-weight:700}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:640px){
  .e-bar{grid-template-columns:repeat(10,8px)}
  #classBadge small{display:none}
  #energy{flex-wrap:wrap;border-radius:14px;row-gap:6px;column-gap:8px}
  #energy .e-lab{order:0}
  #energy .e-msg{order:1;font-size:14px}
  #energy .e-brk{display:block;order:2;flex-basis:100%;height:0}
  #energy .ebtn,#energy .e-bar{order:3}
  .cell{min-width:20px;height:20px;font-size:11px}
  #player{flex-basis:100%;order:3}
  #classBadge{font-size:18px}
  .who{flex-direction:column;text-align:center}
}
/* dragon awakening: the screen itself grows tense */
#dragonfx{position:absolute;left:0;right:0;z-index:4;pointer-events:none;overflow:hidden;opacity:0;transition:opacity 1.4s ease;--a:0;--p:4s}
#dragonfx.on{opacity:1}
#dragonfx .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(160,24,8,var(--a)) 100%);animation:breathe var(--p) ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
#dragonfx .flash{position:absolute;inset:0;background:rgba(200,40,10,.28);opacity:0}
#dragonfx .flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#dragonfx .emb{position:absolute;bottom:-12px;width:7px;height:7px;border-radius:50%;background:#ffb34a;box-shadow:0 0 10px 3px rgba(255,120,30,.7);opacity:0;animation:ember 4.5s linear infinite}
#dragonfx:not(.hot) .emb{display:none}
@keyframes ember{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx,20px),-70vh);opacity:0}}
#dragonfx .eye{position:absolute;left:50%;top:-6px;width:min(300px,34vw);transform:translate(-50%,-130%);transition:transform 1.8s ease;filter:drop-shadow(0 0 22px rgba(255,90,20,.8))}
#dragonfx.peek .eye{transform:translate(-50%,-30%)}
#dragonfx .eye .lid2{transform-origin:100px 55px;animation:blink 5s ease-in-out infinite}
@keyframes blink{0%,44%,56%,100%{transform:scaleY(1)}50%{transform:scaleY(.08)}}
#mapwrap.rumble,#planetView.rumble{animation:rumble .6s linear}
@keyframes rumble{10%,50%,90%{transform:translate(-6px,2px)}30%,70%{transform:translate(6px,-2px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const ptsAttr = pts => pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
function centroid(pts){
  let a=0,cx=0,cy=0;
  for(let i=0;i<pts.length;i++){ const [x0,y0]=pts[i],[x1,y1]=pts[(i+1)%pts.length]; const f=x0*y1-x1*y0; a+=f; cx+=(x0+x1)*f; cy+=(y0+y1)*f; }
  if(Math.abs(a)<1e-6){ const n=pts.length||1; return [pts.reduce((s,p)=>s+p[0],0)/n, pts.reduce((s,p)=>s+p[1],0)/n]; }
  return [cx/(3*a), cy/(3*a)];
}
const anchor = r => (r.lx!=null && r.ly!=null) ? [r.lx*VW, r.ly*VH] : centroid(polyPts(r));
function inPoly(x, y, pts){ let ins=false; for(let i=0,j=pts.length-1;i<pts.length;j=i++){ const [xi,yi]=pts[i],[xj,yj]=pts[j]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; } return ins; }

/* ---------------- adjacency & travel ---------------- */
let adjCache = null, adjKey = "";
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy; let t = l ? ((px-ax)*dx+(py-ay)*dy)/l : 0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(ax+t*dx), py-(ay+t*dy)); }
function touching(A, B){
  const eps = 22; let hits = 0;
  for(const [x,y] of A){ for(let j=0;j<B.length;j++){ const [ax,ay]=B[j],[bx,by]=B[(j+1)%B.length]; if(segDist(x,y,ax,ay,bx,by) < eps){ hits++; break; } } if(hits>=2) return true; }
  for(const [x,y] of B){ for(let j=0;j<A.length;j++){ const [ax,ay]=A[j],[bx,by]=A[(j+1)%A.length]; if(segDist(x,y,ax,ay,bx,by) < eps){ hits++; break; } } if(hits>=2) return true; }
  return false;
}
function adjacency(){
  const key = regionList().map(r=>r.id+":"+r.poly.join(",")).join("|");
  if(adjCache && key===adjKey) return adjCache;
  const list = regionList(), P = new Map(list.map(r=>[r.id, polyPts(r)])), adj = new Map(list.map(r=>[r.id,new Set()]));
  for(let i=0;i<list.length;i++) for(let j=i+1;j<list.length;j++){ const a=list[i].id, b=list[j].id; if(P.get(a).length>2 && P.get(b).length>2 && touching(P.get(a),P.get(b))){ adj.get(a).add(b); adj.get(b).add(a); } }
  adjCache = adj; adjKey = key; return adj;
}
const routeKey = (a,b) => [a,b].sort().join("|");
const route = (a,b) => S.routes.edges?.[routeKey(a,b)] || {};
const wallOf = (from,to) => S.routes.dir?.[from+">"+to] || {};
function routeCost(a,b){ const rt = route(a,b), r = S.regions.get(b); return typeof rt.cost==="number" ? rt.cost : (r ? r.cost : 1); }
function travelCheck(c, to){
  const r = S.regions.get(to); if(!c || !r) return { ok:false, reason:"" };
  if(c.pending) return { ok:false, reason:"C'è già un viaggio in corso." };
  if(!c.at) return { ok:true, cost:0, trial:!zoneOf(c,to) };
  if(to===c.at) return { ok:false, reason:"La compagnia è già qui." };
  const z = zoneOf(c,to), near = adjacency().get(c.at)?.has(to), rt = route(c.at,to);
  if(!z && r.shipOnly && !c.ship) return { ok:false, reason:`${r.name} si raggiunge solo in nave.` };
  const dw = wallOf(c.at,to), roadWall = near && (dw.wall || rt.wall);
  const barred = !z && (roadWall || r.sealed);
  if(!barred && near && rt.closed && !c.ship) return { ok:false, reason:"Questa strada si percorre solo in nave." };
  if(!barred && !near && !c.ship) return { ok:false, reason:"Troppo lontano: ci si muove solo verso le zone confinanti, a meno di avere la nave." };
  if(barred && !near && !c.ship) return { ok:false, reason:"Troppo lontano: ci si muove solo verso le zone confinanti, a meno di avere la nave." };
  const viaShip = !near || (!!rt.closed && !rt.wall) || (!z && r.shipOnly);
  const cost = z ? 0 : (viaShip ? (S.settings.shipCost ?? 2) : routeCost(c.at,to));
  if(c.lanterns < cost) return { ok:false, cost, reason:`Servono ${cost} lanterne e ne avete ${c.lanterns}: fate scorta in un'area secondaria.` };
  return { ok:true, cost, trial:!z, ship:viaShip, wall:barred, wallText: (roadWall && dw.text) || r.wallText || "" };
}

/* ---------------- persistence ---------------- */
const queues = {};
function write(path, body){
  if(!S.db) return;
  const q = queues[path] || (queues[path] = { running:false, next:null });
  q.next = body; if(!q.running) runQueue(path);
}
async function runQueue(path){
  const q = queues[path]; q.running = true; setStatus("Salvataggio…");
  while(q.next){
    const body = q.next; q.next = null;
    try { await S.db.doc(path).set(body); }
    catch(e){ if(e && e.code==="unavailable"){ await new Promise(r=>setTimeout(r, 700+Math.random()*700)); try{ await S.db.doc(path).set(body);}catch(e2){ writeErr(e2); } } else writeErr(e); }
  }
  q.running = false; if(!Object.values(queues).some(x=>x.running)) setStatus("Salvato");
}
function writeErr(e){ const c=e&&e.code; toast(c==="quota_exceeded"?"Spazio di salvataggio pieno.":c==="invalid_argument"?"Non hai i permessi per salvare su questa mappa.":"Salvataggio non riuscito: controlla la connessione."); setStatus("Non salvato"); }
async function removeDoc(path){ if(!S.db) return; try{ await S.db.doc(path).delete(); }catch(e){ writeErr(e); } }
function setStatus(s){ if(!S.db) return; S.status=s; const el=$("#saveStatus"); if(el) el.textContent=s; }
const timers = {};
function objAt(path){
  const [col, id] = path.split("/");
  if(col==="settings") return id==="main" ? S.settings : id==="routes" ? S.routes : id==="carillon" ? S.carillon : id==="sounds" ? S.sounds : null;
  const m = {regions:S.regions, tracks:S.tracks, classes:S.classes, items:S.items, events:S.events, sides:S.sides, planets:S.planets}[col];
  return m ? m.get(id) : null;
}
function save(path){ clearTimeout(timers[path]); delete timers[path]; const o = objAt(path); if(o) write(path, path.startsWith("settings/") ? clone(o) : bodyOf(o)); }
function saveSoon(path){ clearTimeout(timers[path]); setStatus("Modifiche in corso…"); timers[path] = setTimeout(()=>save(path), 700); }

function addLog(c, text){ if(!text) return; c.log.push({ t:Date.now(), x:text }); if(c.log.length>300) c.log = c.log.slice(-300); }
function mutate(fn, logText){ const c = cls(); if(!c) return; const txt = typeof logText==="function" ? logText(c) : logText; fn(c); addLog(c, txt); saveClass(c); renderAll(); }

/* ---------------- game rules ---------------- */
function freshClass(c){
  const st = S.regions.has(S.settings.startRegion) ? S.settings.startRegion : regionList()[0]?.id;
  Object.assign(c, { zones: st?{[st]:"liberated"}:{}, at:st||null, path:st?[st]:[], lanterns:3, items:[], pieces:[], ship:false, dragon:0, steps:{}, visited:[], loreSeen:[], planetsSeen:[], deckUsed:[], log:[], pending:null });
  addLog(c, `La compagnia ${c.name} parte da casa: ${S.regions.get(st)?.name || "la città"}.`);
}
function drawEvent(c){
  const all = sorted(S.events); if(!all.length) return null;
  let pool = all.filter(e => !c.deckUsed.includes(e.id));
  if(!pool.length){ c.deckUsed = []; pool = all; }
  const e = pool[Math.floor(Math.random()*pool.length)]; c.deckUsed.push(e.id); return e;
}
function finishMove(c){ const to = c.pending.to; c.at = to; c.path.push(to); if(c.path.length>120) c.path = c.path.slice(-120); c.pending = null; }
function startTravel(to){
  const c = cls(), chk = travelCheck(c, to); if(!chk.ok){ toast(chk.reason); return; }
  const r = S.regions.get(to);
  if(chk.wall){ mutate(c => { c.lanterns -= chk.cost; c.pending = { to, from:c.at, cost:chk.cost, trial:false, eventId:null, step:"wall", wallText:chk.wallText||"" }; }, `In viaggio verso ${r.name}${chk.cost?` (${chk.cost} ${chk.cost===1?"lanterna":"lanterne"})`:""}${chk.ship?", con la nave":""}.`); closeView(); return; }
  mutate(c => {
    c.lanterns -= chk.cost;
    const ev = drawEvent(c);
    c.pending = { to, from:c.at, cost:chk.cost, trial:!!chk.trial, eventId: ev?.id || null, step: ev ? "event" : (chk.trial ? "camp" : "done") };
    if(c.pending.step==="done") finishMove(c);
  }, `In viaggio verso ${r.name}${chk.cost?` (${chk.cost} ${chk.cost===1?"lanterna":"lanterne"})`:""}${chk.ship?", con la nave":""}.`);
  closeView();
}
function resolveEvent(apply){
  const c0 = cls(), p0 = c0?.pending, ev = p0 && S.events.get(p0.eventId);
  mutate(c => {
    const p = c.pending; if(!p) return;
    if(apply && ev && ev.lanterns) c.lanterns = Math.max(0, c.lanterns + ev.lanterns);
    if(!p.to){ c.pending = null; return; }
    if(p.trial) p.step = "camp"; else finishMove(c);
  }, ev ? `Imprevisto: ${ev.title}${apply && ev.lanterns ? ` (${ev.lanterns>0?"+":""}${ev.lanterns} lanterne)` : ""}.${p0?.trial && p0?.to ? ` La compagnia si accampa alle porte di ${S.regions.get(p0.to)?.name||"una nuova zona"}.` : ""}` : null);
}
function resolveTrial(pass){
  const c0 = cls(), p = c0?.pending; if(!p) return; const r = S.regions.get(p.to);
  mutate(c => { if(pass){ c.zones[p.to] = "explored"; finishMove(c); } else c.pending = null; },
    pass ? `Prova d'ingresso superata: la compagnia entra in ${r?.name}.` : `La nebbia ha respinto la compagnia da ${r?.name}: le lanterne sono perse.`);
}
function wallBack(){ const c0=cls(), r=S.regions.get(c0?.pending?.to); mutate(c => { c.pending = null; }, `La strada verso ${r?.name||"quella zona"} era sbarrata: la compagnia torna indietro e le lanterne sono perse.`); }
function startTrial(){ const c=cls(); if(!c?.pending || c.pending.step!=="camp") return; mutate(c => { c.pending.step="trial"; }); }

/* appunti dell'allievo: the student's song in 4 pieces; pieces not yet found play as silence */
let carRAF=null;
function carSegments(){ const st=(S.carillon.starts||[]); const out=[]; for(let i=0;i<NP;i++){ const a=st[i]; if(typeof a!=="number"||isNaN(a)) return null; out.push(a); } return out; }
async function playCarillon(){
  if(REMOTE) return; const o=S.carillon; if(!o.audioId){ toast("La canzone dell'allievo è ancora muta: caricala in Regia → Contenuti → Appunti."); return; }
  const segs = carSegments(); if(!segs){ toast("Segna dove inizia ognuno dei 4 appunti in Regia → Contenuti → Appunti."); return; }
  let src; try{ src = await audioUrl(o); }catch{ toast("Non riesco a caricare la canzone dell'allievo."); return; }
  if(!bgm.paused) fadeTo(0,500,()=>bgm.pause());
  if(car.getAttribute("src")!==src) car.src=src;
  car.currentTime = segs[0]; car.volume = 0; $("#carillon").classList.add("playing");
  try{ await car.play(); }catch{ $("#carillon").classList.remove("playing"); toast("Tocca una volta la mappa sulla LIM per attivare la musica."); return; }
  const have = new Set(cls()?.pieces||[]);
  const tick = () => {
    if(car.paused){ $("#carillon").classList.remove("playing"); markCell(-1); return; }
    const t=car.currentTime; let idx=-1; for(let i=0;i<NP;i++) if(t>=segs[i]) idx=i;
    car.volume = (idx>=0 && have.has(idx+1) && !S.muted) ? S.vol : 0; markCell(idx);
    carRAF = requestAnimationFrame(tick);
  };
  cancelAnimationFrame(carRAF); tick();
}
function pauseCarillon(){ if(!car.paused) car.pause(); }

function melodyHTML(txt){
  let magic=false;
  const note = t => { const w=t.replace(/[^A-Za-zÀ-ÿ#♭♯]/g,""); if(!w) return ""; const m=w.length>1 && w===w.toUpperCase(); if(m) magic=true; return `<span class="nt${m?" magic":""}">${esc(w.charAt(0).toUpperCase()+w.slice(1).toLowerCase())}</span>`; };
  const rows = [];
  String(txt||"").split("\n").map(l=>l.trim()).filter(Boolean).forEach((line,i)=>{
    // a dash starts a new row; two spaces or a full stop separate groups inside a row
    line.split(/\s*[-–—]\s*/).map(x=>x.trim()).filter(Boolean).forEach((part,j)=>{
      const groups = part.split(/\s{2,}|\.\s+|\.$/).map(g=>g.trim()).filter(Boolean);
      rows.push(`<div class="ml${j?" cont":""}"><span class="mn">${j?"":i+1}</span>${groups.map(g=>`<span class="mg">${g.split(/\s+/).map(note).join("")}</span>`).join("")}</div>`);
    });
  });
  if(!rows.length) return "";
  return `<div class="mh">La melodia del pianeta</div>${rows.join("")}${magic?`<div class="mleg"><span class="nt magic">La</span> la nota magica</div>`:""}`;
}

function renderCardButtons(){

$("#scrim").addEventListener("pointerdown", e => { if(e.target.id==="scrim" && !cls()?.pending) closeView(); });
$("#card").addEventListener("click", e => {
  const b=e.target.closest("[data-ov],.close"); if(!b) return; if(b.classList.contains("close")){ closeView(); return; }
  const a=b.dataset.ov, v=S.view;
  if(a==="close") closeView();
  else if(a==="go") startTravel(b.dataset.id);
  else if(a==="evapply") resolveEvent(true);
  else if(a==="evskip") resolveEvent(false);
  else if(a==="trialok") resolveTrial(true);
  else if(a==="trialko") resolveTrial(false);
  else if(a==="trialwait") mutate(c=>{ if(c.pending) c.pending.step="camp"; });
  else if(a==="wallback") wallBack();
  else if(a==="free") liberate(v.id);
  else if(a==="play"){ if(nowPlaying===v.id && !bgm.paused) stopMusic(); else { if(S.muted){ S.muted=false; ls.set("mappa.muted",false); renderMute(); } playRegion(v.id); } }
  else if(a==="goto") startTravel(v.id);
  else if(a==="launch") setScene(b.dataset.id);
  else if(a==="dragonhit") dragonReset();
  else if(a==="dragonspare") mutate(c=>{ c.dragon=7; }, "Il dragone vi ha risparmiati, per questa volta.");
  else if(a==="buy") buyItem(v.id, b.dataset.id);
  else if(a==="reward") rewardSide(v.id, +b.dataset.n);
  else if(a==="use") useItem(v.i);
  else if(a==="lore") openLore(v.id);
  else if(a==="secret") openView({k:"secret", id:v.id});
  else if(a==="trial") openView({k:"rtrial", id:v.id, i:+b.dataset.i});
  else if(a==="trialpass"){ passTrial(v.id, v.i); openView({k:"region", id:v.id}); }
  else if(a==="regcard") openView({k:"region", id:v.id});
  else if(a==="guard") openView({k:"guardian", id:v.id});
  else if(a==="untrial"){ const r=S.regions.get(v.id), i=+b.dataset.i; if(r) undoable("Prova tornata da fare.", c => { const arr=(c.steps[r.id]||[]).slice(); for(let k=i;k<arr.length;k++) arr[k]=false; c.steps[r.id]=arr; if(c.zones[r.id]==="liberated"){ c.zones[r.id]="explored"; dropNote(c,r); } }, `${r.name}: la prova "${trialTitle(r,i)}" torna da fare.`); }
  else if(a==="unguard"){ const r=S.regions.get(v.id); if(r) undoable("Prova del guardiano annullata.", c => { c.zones[r.id]="explored"; dropNote(c,r); }, `${r.name}: la prova del guardiano torna da fare.`); }
  else if(a==="unentry"){ const r=S.regions.get(v.id); if(r){ undoable("Prova d'ingresso annullata.", c => { const prev=[...c.path].reverse().find(x => x!==r.id && c.zones[x]) || startId() || null; if(c.zones[r.id]==="liberated") dropNote(c,r); delete c.zones[r.id]; c.steps[r.id]=[]; c.at=prev; c.pending={ to:r.id, from:prev, cost:0, trial:true, eventId:null, step:"camp" }; }, `${r.name}: la prova d'ingresso torna da fare, la compagnia è di nuovo accampata alle porte.`); closeView(); } }
  else if(a==="guardpass"){ liberate(v.id); closeView(); }
  else if(a==="guardnot"){ const r=S.regions.get(v.id); mutate(() => {}, `${r?.name||"La regione"}: la prova del guardiano si riprova la prossima volta.`); closeView(); }
  else if(a==="trialnot"){ failTrial(v.id, v.i); closeView(); }
  else if(a==="cronache") openView({k:"panel", p:"cronache"});
  else if(a==="bag") openView({k:"panel", p:"zaino"});
  else if(a==="item") openView({k:"item", i:+b.dataset.i});
  else if(a==="diario"){ S.view={...v, all:!v.all}; renderOverlay(); }
});

  try{ const res=await S.assets.upload(f); const key=imgKind==="lore"?"loreImgId":"bgId", old=bg?r[key]:r.character.imageId; if(bg) r[key]=res.id; else r.character.imageId=res.id; save((sideImg?"sides/":"regions/")+r.id); renderAll(); toast(bg?"Immagine caricata":"Ritratto caricato"); if(old) S.assets.delete(old).catch(()=>{}); }
  catch(err){ toast(err&&err.code==="unsupported_type"?"Usa un'immagine .png, .jpg o .webp.":"Caricamento non riuscito, riprova."); }
});
async function doBackup(){
  const list = m => sorted(m).map(x=>({id:x.id,...bodyOf(x)}));
  const data={app:"mappa-avventura",version:2,savedAt:new Date().toISOString(),settings:S.settings,routes:S.routes,carillon:S.carillon,sounds:S.sounds,
    regions:list(S.regions),tracks:list(S.tracks),classes:list(S.classes),items:list(S.items),events:list(S.events),sides:list(S.sides),planets:list(S.planets)};
  const json=JSON.stringify(data,null,2), d=new Date(), name=`mappa-avventura-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}.json`;
  if(S.downloads){ try{ await S.downloads.save({filename:name,data:new Blob([json],{type:"application/json"})}); return; }catch(e){ if(e&&(e.code==="cancelled"||e.code==="declined")) return; } }
  try{ await navigator.clipboard.writeText(json); toast("Copia di sicurezza copiata negli appunti"); }catch{ toast("Il salvataggio del file non è disponibile qui."); }
}
$("#fileBackup").addEventListener("change", async e => {
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{ const d=JSON.parse(await f.text()); if(d.app!=="mappa-avventura"||!Array.isArray(d.regions)) throw 0;
    const put=(col,arr,norm,map)=>{ for(const x of (arr||[])){ if(!x.id) continue; const o=norm(x.id,x); map.set(o.id,o); save(col+"/"+o.id); } };
    put("regions",d.regions,normRegion,S.regions); put("tracks",d.tracks,normTrack,S.tracks); put("classes",d.classes,normClass,S.classes); put("items",d.items,normItem,S.items); put("events",d.events,normEvent,S.events); put("sides",d.sides,normSide,S.sides); put("planets",d.planets,normPlanet,S.planets);
    if(d.settings){ Object.assign(S.settings,d.settings); save("settings/main"); } if(d.routes){ S.routes={edges:d.routes.edges||{}, dir:d.routes.dir||{}}; save("settings/routes"); } if(d.carillon){ S.carillon={...S.carillon,...d.carillon}; save("settings/carillon"); } if(d.sounds){ S.sounds=normSounds(d.sounds); save("settings/sounds"); }
    syncFog(false); renderAll(); toast("Copia ripristinata"); }
  catch{ toast("Questo file non è una copia della mappa."); }
});

/* ---------------- live sync (remote) ---------------- */
function writeLive(patch){ Object.assign(S.live,patch); write("live/main",{...S.live}); }
function setRemote(on){
  REMOTE=on; ls.set("mappa.remote",on); document.body.classList.toggle("remote",on); $("#dTitle").textContent=on?"Telecomando":"Regia";
  if(on){ stopMusic(); closeView(); S.tab="lezione"; document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.tab==="lezione"))); setDrawer(true); toast("Questo dispositivo ora è il telecomando"); }
  else { setDrawer(false); maskDirty=true; lastFrame=0; }
}

/* ---------------- render all ---------------- */
function renderAll(){
  const ready=S.offline||S.loaded.regions;
  $("#empty").hidden=!(ready && S.regions.size===0 && !editing());
  document.body.classList.toggle("editing", editing());
  if(lastClassForFog!==(cls()?.id??null)){ lastClassForFog=cls()?.id??null; syncFog(false); } else syncFog(true);
  renderSvg(); renderHud(); renderDrawer(); renderPlayer(); renderOverlay();
  if(S.scene) renderMelody();
  const atKey=(cls()?.id||"")+":"+(cls()?.at||""); if(atKey!==lastAtKey){ const first=lastAtKey===null; lastAtKey=atKey; if(!first) playHere(); }
  applyMuffle(true);
}

/* ---------------- controls ---------------- */
$("#btnRegia").onclick=()=>setDrawer(!S.drawerOpen);
$("#btnCloseDrawer").onclick=()=>setDrawer(false);
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$("#btnPrev").onclick=()=>openView({k:"panel",p:"diario"});
$("#btnAlbum").onclick=()=>openView({k:"panel",p:"album"});
$("#btnSecrets").onclick=()=>openView({k:"panel",p:"segreti"});
$("#btnChron").onclick=()=>openView({k:"panel",p:"cronache"});
async function toggleFull(){ try{ if(document.fullscreenElement) await document.exitFullscreen(); else { await document.documentElement.requestFullscreen(); try{ await navigator.wakeLock?.request("screen"); }catch{} } }catch{ toast("Lo schermo intero non è disponibile qui: usa F11 sul computer della LIM."); } }
$("#btnFull").onclick=toggleFull;
$("#btnSeed").onclick=seedWorld;
document.addEventListener("keydown", e => {
  const tg=e.target; if(tg && (tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.tagName==="SELECT")){ if(e.key==="Escape") tg.blur(); return; }
  if(e.key==="Escape" && !$("#ctx").hidden){ closeCtx(); return; }
  if(e.key==="Escape"){ if(S.drawing) $("[data-act=canceldraw]")?.click(); else if(S.view) closeView(); else if(S.scene) setScene(null); else if(S.drawerOpen) setDrawer(false); }
  else if(REMOTE) return;
  else if(e.key==="r"||e.key==="R") setDrawer(!S.drawerOpen);
  else if(e.key==="f"||e.key==="F") toggleFull();
  else if(e.key==="m"||e.key==="M") toggleMute();
  else if(e.key==="0"){ Z.k=1; applyZ(); }
  else if((e.key==="+"||e.key==="=") && S.settings.energyEnabled) dragonStep(1);
  else if((e.key==="-"||e.key==="_") && S.settings.energyEnabled) dragonStep(-1);
});
window.addEventListener("resize", layout);
try{ const ro=new ResizeObserver(()=>layout()); ro.observe($("#topbar")); ro.observe($("#botbar")); ro.observe($("#view")); }catch{}

/* ---------------- boot ---------------- */
function seedWorld(){
  for(const d of DEFAULT_REGIONS){ const r=normRegion(d.id,d); S.regions.set(r.id,r); save("regions/"+r.id); }
  S.settings.startRegion="borgo"; save("settings/main");
  if(!S.planets.size){ const pl=normPlanet("dorico",{name:"Il Pianeta Dorico"}); S.planets.set(pl.id,pl); save("planets/"+pl.id); }
  if(!S.classes.size) for(const [i,n] of ["2A","2B"].entries()){ const c=normClass(n,{name:n,order:i+1}); freshClass(c); S.classes.set(n,c); saveClass(c); }
  syncFog(false); renderAll();
}
function bootOffline(){
  S.offline=true;
  DEFAULT_REGIONS.forEach(d=>S.regions.set(d.id,normRegion(d.id,d)));
  [["e1",{title:"Vento contrario (esempio)",text:"Una raffica spegne una lanterna, a meno che la compagnia non tenga un ostinato per 30 secondi.",lanterns:-1}],["e2",{title:"Un viandante gentile (esempio)",text:"Vi regala una lanterna di scorta.",lanterns:1}]].forEach(([id,v])=>S.events.set(id,normEvent(id,v)));
  [["o1",{name:"Corno degli orchi (esempio)",effect:"Permette di ripetere una prova fallita.",price:3,color:"#d9663f"}],["o2",{name:"Bussola (esempio)",effect:"Mostra cosa c'è in una zona prima di pagarne il viaggio.",price:2,color:"#8fd3e8"}]].forEach(([id,v])=>S.items.set(id,normItem(id,v)));
  [["a1",{name:"La nave nella baia (esempio)",kind:"attivita",x:0.27,y:0.73,activity:"Il capitano insegna la canzone dei marinai.",reward:"Fino a 3 lanterne"}],["a2",{name:"Il bazar di Karesh (esempio)",kind:"mercante",x:0.6,y:0.83,activity:"Il mercante vi mostra la sua merce."}]].forEach(([id,v])=>S.sides.set(id,normSide(id,v)));
  S.planets.set("dorico", normPlanet("dorico",{name:"Il Pianeta Dorico"}));
  for(const [i,n] of ["2A","2B"].entries()){ const c=normClass(n,{name:n,order:i+1}); freshClass(c); S.classes.set(n,c); }
  S.loaded.regions=true; syncFog(false); renderAll();
}
let migrated=false;
function migrateTracks(){
  if(migrated || !S.db || !S.loaded.regions || !S.loaded.tracks) return; migrated=true;
  for(const r of regionList()){ if(!r.audioId) continue; const tid="t_"+r.id;
    if(!S.tracks.has(tid) && ![...S.tracks.values()].some(t=>t.audioId===r.audioId)){ const t=normTrack(tid,{ name:(r.audioName||r.name).replace(/\.[^.]+$/,""), order:r.order, audioId:r.audioId, audioEnc:r.audioEnc, audioName:r.audioName, regions:[r.id] }); S.tracks.set(tid,t); save("tracks/"+tid); }
    r.audioId=""; r.audioEnc=""; r.audioName=""; save("regions/"+r.id); }
  renderAll();
}
function subCol(name, map, norm, after){
  S.db.collection(name).onSnapshot(snap=>{
    const m=new Map();
    for(const d of snap.docs){ const v=d.data(); if(v) m.set(d.id, norm(d.id, v)); }
    for(const path of Object.keys(timers)){ const [col,id]=path.split("/"); if(col===name && map.has(id)) m.set(id, map.get(id)); }
    if(name==="regions"){ if(S.drawing && S.sel && map.has(S.sel) && !m.has(S.sel)) m.set(S.sel, map.get(S.sel)); if(drag && map.has(drag.id)) m.set(drag.id, map.get(drag.id)); }
    map.clear(); for(const [k,v] of m) map.set(k,v);
    after && after(snap); renderAll(); if(S.view) renderOverlay();
  }, ()=>{ if(name==="regions"){ S.loaded.regions=true; renderAll(); } });
}
async function boot(){
  layout(); renderMute();
  if(REMOTE){ document.body.classList.add("remote"); $("#dTitle").textContent="Telecomando"; S.drawerOpen=true; $("#drawer").classList.add("open"); }
  renderAll(); requestAnimationFrame(frame);
  const cl=window.claude; if(!cl||typeof cl.use!=="function"){ bootOffline(); return; }
  const db=await cl.use("db").catch(()=>null); if(!db){ bootOffline(); return; }
  S.db=db;
  cl.use("assets").then(a=>{ S.assets=a; renderDrawer(true); }).catch(()=>{});
  cl.use("downloads").then(d=>{ S.downloads=d; }).catch(()=>{});
  const slow=setTimeout(()=>{ if(!S.loaded.regions) toast("I dati della mappa non arrivano: controlla la connessione."); },10000);
  subCol("regions", S.regions, normRegion, snap=>{ if(!snap.metadata.fromCache){ S.loaded.regions=true; clearTimeout(slow); migrateTracks(); } });
  subCol("tracks", S.tracks, normTrack, snap=>{ if(!snap.metadata.fromCache){ S.loaded.tracks=true; migrateTracks(); } });
  subCol("classes", S.classes, normClass, ()=>{ if(S.live.cls && S.classes.has(S.live.cls)) S.activeClass=S.live.cls; if(!S.classes.has(S.activeClass)) S.activeClass=classList()[0]?.id||null; });
  subCol("items", S.items, normItem); subCol("events", S.events, normEvent); subCol("sides", S.sides, normSide); subCol("planets", S.planets, normPlanet);
  const doc=(p,fn)=>db.doc(p).onSnapshot(d=>{ if(!timers[p]) fn(d.exists?d.data():null); renderAll(); },()=>{});
  doc("settings/main", v=>{ S.settings={ energyEnabled:!!v?.energyEnabled, startRegion:v?.startRegion||"borgo", shipCost:typeof v?.shipCost==="number"?v.shipCost:2 }; });
  doc("settings/routes", v=>{ S.routes={ edges:{...(v?.edges||{})}, dir:{...(v?.dir||{})} }; });
  doc("settings/carillon", v=>{ S.carillon={ starts:(v?.starts||[]).slice(), names:(v?.names||[]).slice(), audioId:v?.audioId||"", audioEnc:v?.audioEnc||"", audioName:v?.audioName||"" }; });
  doc("settings/sounds", v=>{ S.sounds=normSounds(v); });
  let liveSeen=false;
  db.doc("live/main").onSnapshot(d=>{
    const v=(d.exists&&d.data())||{}, prev=S.live;
    S.live={cls:v.cls||null,card:v.card||null,cardN:v.cardN||0,music:v.music||null,musicN:v.musicN||0,vol:typeof v.vol==="number"?v.vol:null,panel:v.panel||null,panelN:v.panelN||0,scene:v.scene||null,sceneN:v.sceneN||0};
    if(liveSeen && S.live.sceneN!==prev.sceneN && (S.live.scene||null)!==S.scene) setScene(S.live.scene, true);
    if(S.live.cls && S.live.cls!==S.activeClass && S.classes.has(S.live.cls)) selectClassLocal(S.live.cls);
    if(!REMOTE && liveSeen){
      if(S.live.cardN!==prev.cardN){ const cd=S.live.card; if(cd && cd.startsWith("side:")) openView({k:"side",id:cd.slice(5)}); else if(cd && cd.startsWith("lore:") && S.regions.has(cd.slice(5))) openView({k:"lore",id:cd.slice(5)}); else if(cd && cd.startsWith("guard:") && S.regions.has(cd.slice(6))) openView({k:"guardian",id:cd.slice(6)}); else if(cd && cd.startsWith("trial:")){ const [,rid,ii]=cd.split(":"); if(S.regions.has(rid)) openView({k:"rtrial",id:rid,i:+ii}); } else if(cd && S.regions.has(cd)) openView({k:"region",id:cd}); else closeView(); }
      if(S.live.panelN!==prev.panelN){ if(S.live.panel) openView({k:"panel",p:S.live.panel}); else if(S.view?.k==="panel") closeView(); }
      if(S.live.musicN!==prev.musicN){ if(S.live.music==="__carillon") playCarillon(); else if(S.live.music) playRegion(S.live.music); else { stopMusic(); pauseCarillon(); } }
      if(S.live.vol!=null && S.live.vol!==prev.vol && Math.abs(S.live.vol-S.vol)>0.001) setVolume(S.live.vol,true);
    }
    liveSeen=true; renderDrawer();
  },()=>{});
}
boot();
})();
</script>
